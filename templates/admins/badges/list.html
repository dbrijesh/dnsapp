{% extends 'base.html' %}

{% block title %}Badges - Admin{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2>Badges</h2>
        <p class="text-muted mb-0">Manage achievement badges</p>
    </div>
    <a href="{% url 'admins:badge_create' %}" class="btn btn-primary">
        <i class="bi bi-plus-circle me-1"></i> Create Badge
    </a>
</div>

<div class="row g-4">
    {% for badge in badges %}
    <div class="col-md-4">
        <div class="card">
            <div class="card-body text-center">
                <i class="bi bi-trophy-fill" style="font-size: 3rem; color: {{ badge.color }};"></i>
                <h5 class="mt-3">{{ badge.title }}</h5>
                <p class="text-muted small">{{ badge.description }}</p>
                <a href="{% url 'admins:badge_edit' badge.id %}" class="btn btn-sm btn-outline-primary">Edit</a>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-12">
        <p class="text-muted">No badges created yet.</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
