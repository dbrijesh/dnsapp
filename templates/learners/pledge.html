{% extends 'base.html' %}

{% block title %}Program Pledge - Lead-Up App{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-body p-5">
                <h2 class="mb-4">{{ template.pledge_title }}</h2>

                <div class="mb-4">
                    {{ template.pledge_content|linebreaks }}
                </div>

                <form method="post">
                    {% csrf_token %}
                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="acceptPledge" required>
                        <label class="form-check-label" for="acceptPledge">
                            I accept this pledge and commit to the leadership program
                        </label>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{% url 'learners:onboarding' program.id %}" class="btn btn-outline-secondary">Back</a>
                        <button type="submit" class="btn btn-primary">Accept & Continue</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
