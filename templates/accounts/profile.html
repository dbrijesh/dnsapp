{% extends 'base.html' %}

{% block title %}Profile - Lead-Up App{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-body">
                <h3 class="card-title mb-4">Profile Settings</h3>

                <div class="mb-3">
                    <label class="form-label fw-bold">Name</label>
                    <p>{{ user.get_full_name }}</p>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Email</label>
                    <p>{{ user.email }}</p>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Role</label>
                    <p>
                        {% if user.is_learner %}<span class="badge bg-primary">Learner</span>{% endif %}
                        {% if user.is_admin %}<span class="badge bg-warning">Admin</span>{% endif %}
                    </p>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Member Since</label>
                    <p>{{ user.date_joined|date:"F d, Y" }}</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
